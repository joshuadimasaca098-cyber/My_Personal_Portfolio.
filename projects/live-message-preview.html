<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="A live message preview built with HTML, CSS and JavaScript. Type a message to see it update instantly, with a character counter and light/dark theme toggle.">
<title>Live Message Preview</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1a1a1a;
    --muted: #5f6673;
    --accent: #4f46e5;
    --accent-text: #ffffff;
    --border: #e5e7eb;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  :root[data-theme="dark"] {
    --bg: #14151a;
    --card: #1f2128;
    --text: #f2f2f2;
    --muted: #9aa0ab;
    --accent: #818cf8;
    --accent-text: #14151a;
    --border: #33353d;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    transition: background 0.2s ease, color 0.2s ease;
  }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 28px;
    width: 100%;
    max-width: 480px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    transition: background 0.2s ease, border-color 0.2s ease;
  }
  .card-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  h1 {
    font-size: 1.15rem;
    margin: 0;
  }
  button#themeToggle {
    background: none;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 6px 10px;
    font-size: 1rem;
    cursor: pointer;
  }
  label, .field-label {
    display: block;
    font-size: 0.85rem;
    color: var(--muted);
    margin-bottom: 6px;
  }
  textarea {
    width: 100%;
    min-height: 110px;
    resize: vertical;
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
    font-size: 1rem;
    font-family: inherit;
  }
  .count-row {
    display: flex;
    justify-content: flex-end;
    gap: 4px;
    font-size: 0.8rem;
    color: var(--muted);
    margin-top: 6px;
  }
  .preview-label {
    margin-top: 20px;
  }
  .preview {
    background: var(--bg);
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 14px;
    min-height: 60px;
    white-space: pre-wrap;
    word-wrap: break-word;
    font-size: 1rem;
    line-height: 1.4;
  }
  .back-link {
    display: inline-block;
    margin-bottom: 14px;
    color: var(--accent);
    font-size: 0.9rem;
  }
  :focus-visible {
    outline: 3px solid var(--accent);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
  .preview.empty {
    color: var(--muted);
    font-style: italic;
  }
</style>
</head>
<body>
  <main class="card">
    <a class="back-link" href="../index.html#work">&larr; Back to my portfolio</a>
    <div class="card-header">
      <h1>Live Message Preview</h1>
      <button id="themeToggle" type="button" aria-label="Switch to dark theme"><span aria-hidden="true">🌙</span></button>
    </div>

    <label for="messageInput">Your message</label>
    <textarea id="messageInput" placeholder="Type something..."></textarea>
    <div class="count-row" aria-live="polite"><span id="charCount">0</span>&nbsp;characters</div>

    <div class="preview-label">
      <span class="field-label" id="previewLabel">Preview</span>
      <div id="previewBox" class="preview empty" role="status" aria-live="polite">Your message will appear here...</div>
    </div>
  </main>

<script>
  const input = document.getElementById('messageInput');
  const charCount = document.getElementById('charCount');
  const previewBox = document.getElementById('previewBox');
  const themeToggle = document.getElementById('themeToggle');
  const root = document.documentElement;

  function updatePreview() {
    const text = input.value;
    charCount.textContent = text.length;

    if (text.trim() === '') {
      previewBox.textContent = 'Your message will appear here...';
      previewBox.classList.add('empty');
    } else {
      previewBox.textContent = text;
      previewBox.classList.remove('empty');
    }
  }

  input.addEventListener('input', updatePreview);

  function setTheme(dark) {
    if (dark) root.setAttribute('data-theme', 'dark');
    else root.removeAttribute('data-theme');
    themeToggle.firstElementChild.textContent = dark ? '☀️' : '🌙';
    themeToggle.setAttribute('aria-label', dark ? 'Switch to light theme' : 'Switch to dark theme');
  }

  themeToggle.addEventListener('click', () => {
    setTheme(root.getAttribute('data-theme') !== 'dark');
  });

  // Respect system preference on load
  setTheme(!!(window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches));

  updatePreview();
</script>
</body>
</html>
